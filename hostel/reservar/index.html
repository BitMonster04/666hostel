<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0704">
<title>Reservar | 666 Pinheiros Hostel</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800&family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script>tailwind.config={theme:{extend:{colors:{orneon:{DEFAULT:'#ff8c1a',deep:'#b35400',glow:'#ffb366'}},fontFamily:{heading:['Cinzel','serif'],sans:['Montserrat','sans-serif']}}}}</script>
<style>
html,body{background:#0a0704}body{background-image:radial-gradient(circle at 50% 0%,#2a1d10 0%,#0a0704 60%);background-repeat:no-repeat}
.logo-reserva{filter:drop-shadow(0 0 6px rgba(255,246,236,.5)) drop-shadow(0 0 16px rgba(255,140,26,.65)) drop-shadow(0 0 34px rgba(179,84,0,.5))}
.painel{background:rgba(20,16,10,.85);border:1px solid rgba(255,140,26,.25);border-radius:1rem}
.campo{width:100%;background:#0a0704;border:1px solid rgba(255,140,26,.35);border-radius:.5rem;padding:.7rem .8rem;color:#f3ebe0;font-size:16px;color-scheme:dark}
.campo:focus{outline:2px solid #ff8c1a;outline-offset:1px}
.rotulo{display:block;font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#d8c8b8;margin-bottom:.35rem}
.btn{display:inline-block;padding:.9rem 1.5rem;border-radius:.5rem;background:linear-gradient(90deg,#ff8c1a,#b35400);color:#1a0e00;font-weight:800;font-size:.85rem;text-transform:uppercase;letter-spacing:.12em;text-align:center;box-shadow:0 0 20px rgba(255,140,26,.45)}
.btn:disabled{opacity:.5;cursor:wait}.btn-sec{background:transparent;border:2px solid rgba(255,140,26,.7);color:#ff8c1a;box-shadow:none}
.opcao{display:block;width:100%;text-align:left;border:1px solid rgba(255,140,26,.3);border-radius:.75rem;padding:1rem;background:rgba(0,0,0,.3);transition:border-color .15s}
.opcao:hover:not(:disabled){border-color:#ff8c1a}.opcao[aria-pressed=true]{border-color:#ff8c1a;box-shadow:0 0 18px rgba(255,140,26,.35)}.opcao:disabled{opacity:.45;cursor:not-allowed}
</style>
</head>
<body class="text-gray-200 font-sans antialiased min-h-screen">
<header class="border-b border-orneon/20 bg-black/70">
  <div class="max-w-3xl mx-auto px-4 h-16 flex items-center justify-between">
    <a href="../" class="font-extrabold tracking-widest text-sm text-orange-50" style="text-shadow:0 0 8px #ff8c1a,0 0 20px #ff8c1a">666 PINHEIROS</a>
    <a href="../" class="text-xs font-semibold uppercase tracking-widest text-gray-300 hover:text-orneon">← Hostel</a>
  </div>
</header>
<main class="max-w-3xl mx-auto px-4 py-8">
<p id="avisoTeste" class="hidden mb-4 rounded-md border border-yellow-500 text-yellow-300 text-sm p-3 text-center font-bold">MODO TESTE: nenhum pagamento é real.</p>
<div class="text-center mb-6">
  <img src="../../assets/logo-hostel.webp" alt="Hostel Pinheiros 666" width="1619" height="971" class="logo-reserva w-56 sm:w-72 h-auto mx-auto mb-5">
  <h1 class="font-heading text-2xl sm:text-3xl font-bold text-white">Reserve sua estadia</h1>
  <p class="text-sm text-gray-400 mt-1">Pague na hora com Pix ou cartão, em ambiente seguro do Mercado Pago.</p>
</div>

<section id="fechado" class="hidden painel p-6 text-center"></section>

<div id="fluxo" class="hidden space-y-6">
  <section class="painel p-5">
    <h2 class="font-heading text-lg text-white font-bold mb-4">1. Quando você vem?</h2>
    <div class="grid grid-cols-2 gap-3">
      <div class="min-w-0"><label class="rotulo" for="checkin">Check-in</label><input class="campo" type="date" id="checkin"></div>
      <div class="min-w-0"><label class="rotulo" for="checkout">Check-out</label><input class="campo" type="date" id="checkout"></div>
    </div>
    <p id="horarios" class="text-xs text-gray-400 mt-3"></p>
    <p id="erroDatas" role="alert" class="text-sm text-red-400 mt-2"></p>
  </section>

  <section id="passo2" class="hidden painel p-5">
    <h2 class="font-heading text-lg text-white font-bold mb-4">2. Onde você quer dormir?</h2>
    <div id="opcoes" class="space-y-3"></div>
    <div id="caixaQtd" class="hidden mt-4"><label class="rotulo" for="quantidade" id="rotuloQtd"></label><select class="campo" id="quantidade"></select></div>
  </section>

  <form id="passo3" class="hidden painel p-5 space-y-4" novalidate>
    <h2 class="font-heading text-lg text-white font-bold">3. Seus dados</h2>
    <div><label class="rotulo" for="nome">Nome completo</label><input class="campo" id="nome" autocomplete="name" maxlength="100" required></div>
    <div><label class="rotulo" for="email">E-mail</label><input class="campo" id="email" type="email" autocomplete="email" maxlength="120" required></div>
    <div><label class="rotulo" for="telefone">WhatsApp com DDD</label><input class="campo" id="telefone" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" required></div>
    <div class="rounded-lg bg-black/30 p-4 text-sm" aria-live="polite">
      <div id="resumo" class="text-gray-300"></div>
      <div class="flex justify-between items-baseline mt-2 pt-2 border-t border-orneon/20"><span class="font-bold text-white">Total</span><span id="total" class="text-xl font-extrabold text-orneon"></span></div>
    </div>
    <div id="regrasCancel" class="text-xs text-gray-400"></div>
    <label class="flex gap-3 items-start text-sm cursor-pointer"><input type="checkbox" id="aceite" class="mt-1 w-4 h-4 accent-orange-500 shrink-0"><span>Li e aceito a <a href="../politicas/" target="_blank" class="underline text-orneon">política de reserva e cancelamento</a>.</span></label>
    <p id="erroForm" role="alert" class="text-sm text-red-400"></p>
    <button id="pagar" class="btn w-full" type="submit">Ir para o pagamento</button>
    <p class="text-xs text-gray-500 text-center" id="avisoPrazo"></p>
  </form>
</div>
<script src="../../assets/reservas.js"></script>
<script>
let cfg, opcaoAtual = null, listaOpcoes = [], consultaSeq = 0;
function erroGeral(e) {
  el('fluxo').classList.add('hidden'); el('fechado').classList.remove('hidden');
  mostrarWhats(el('fechado'), e.codigo === 'vendas_fechadas' ? e.message : 'A reserva online está indisponível no momento, mas a gente te atende pelo WhatsApp.');
}
function somaDias(s, n) { return new Date(Date.parse(s + 'T00:00:00Z') + n * 864e5).toISOString().slice(0, 10); }
function hoje() { return new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Sao_Paulo' }).format(new Date()); }
async function iniciar() {
  try { cfg = await apiReservas('/api/config'); } catch (e) { return erroGeral(e); }
  if (!cfg.aberto) { el('fechado').classList.remove('hidden'); return mostrarWhats(el('fechado'), 'As reservas online abrem em breve. Por enquanto, fale com a gente pelo WhatsApp.'); }
  el('avisoTeste').classList.toggle('hidden', cfg.ambiente !== 'teste');
  el('fluxo').classList.remove('hidden');
  const min = cfg.abertura && cfg.abertura > hoje() ? cfg.abertura : hoje();
  el('checkin').min = min; el('checkout').min = somaDias(min, 1);
  el('checkin').max = somaDias(hoje(), cfg.regras.antecedencia_max_dias);
  el('horarios').textContent = `Check-in a partir das ${cfg.horario.checkin} · Check-out até ${cfg.horario.checkout} · Recepção 24h`;
  el('avisoPrazo').textContent = `Sua vaga fica guardada por ${cfg.link_minutos} minutos enquanto você paga.`;
  const fx = [...cfg.cancelamento.faixas].sort((a, b) => b.antes_horas - a.antes_horas);
  el('regrasCancel').textContent = 'Cancelamento: ' + fx.map((f) => f.antes_horas ? `até ${f.antes_horas >= 48 && f.antes_horas % 24 === 0 ? f.antes_horas / 24 + ' dias' : f.antes_horas + ' horas'} antes do check-in, devolvemos ${f.reembolso_pct}%` : `depois disso, ${f.reembolso_pct ? 'devolvemos ' + f.reembolso_pct + '%' : 'sem reembolso'}`).join('; ') + '.';
}
async function consultar() {
  const ci = el('checkin').value, co = el('checkout').value;
  el('erroDatas').textContent = '';
  opcaoAtual = null; atualizarPasso3();
  if (ci) { el('checkout').min = somaDias(ci, 1); }
  if (!ci || !co) { el('passo2').classList.add('hidden'); return; }
  const seq = ++consultaSeq;
  try {
    const { opcoes } = await apiReservas(`/api/disponibilidade?checkin=${ci}&checkout=${co}`);
    if (seq !== consultaSeq) return;
    listaOpcoes = opcoes; pintarOpcoes();
    el('passo2').classList.remove('hidden');
  } catch (e) {
    if (seq !== consultaSeq) return;
    el('passo2').classList.add('hidden');
    if (e.status === 400) el('erroDatas').textContent = e.message; else erroGeral(e);
  }
}
function pintarOpcoes() {
  el('opcoes').replaceChildren(...listaOpcoes.map((o) => {
    const b = no('button', null, 'opcao'); b.type = 'button'; b.disabled = o.vagas < 1; b.setAttribute('aria-pressed', String(opcaoAtual?.id === o.id));
    const topo = no('div', null, 'flex justify-between gap-3 items-baseline');
    topo.append(no('span', o.nome, 'font-bold text-white'), no('span', brl(o.por_unidade_centavos), 'font-extrabold text-orneon whitespace-nowrap'));
    const det = o.tipo === 'cama' ? `por cama, ${o.noites} noite${o.noites > 1 ? 's' : ''}` : `o quarto, ${o.noites} noite${o.noites > 1 ? 's' : ''}`;
    const livres = o.vagas < 1 ? 'Esgotado nessas datas' : o.tipo === 'cama' ? `${o.vagas} cama${o.vagas > 1 ? 's' : ''} livre${o.vagas > 1 ? 's' : ''}` : 'Disponível';
    b.append(topo, no('p', o.descricao, 'text-xs text-gray-400 mt-1'), no('p', `${det} · ${livres}`, 'text-xs mt-1 ' + (o.vagas < 1 ? 'text-red-400' : 'text-gray-300')));
    b.onclick = () => { opcaoAtual = o; prepararQtd(); pintarOpcoes(); atualizarPasso3(); };
    return b;
  }));
}
function prepararQtd() {
  const s = el('quantidade'); const camas = opcaoAtual.tipo === 'cama';
  const max = camas ? opcaoAtual.vagas : opcaoAtual.hospedes_max;
  s.replaceChildren(...Array.from({ length: max }, (_, i) => { const op = no('option', camas ? `${i + 1} cama${i ? 's' : ''}` : `${i + 1} pessoa${i ? 's' : ''}`); op.value = i + 1; return op; }));
  if (!camas) s.value = String(max);
  el('rotuloQtd').textContent = camas ? 'Quantas camas?' : 'Quantas pessoas?';
  el('caixaQtd').classList.toggle('hidden', max < 2);
}
function atualizarPasso3() {
  el('passo3').classList.toggle('hidden', !opcaoAtual);
  if (!opcaoAtual) { el('caixaQtd').classList.add('hidden'); return; }
  const q = opcaoAtual.tipo === 'cama' ? Number(el('quantidade').value) : 1;
  const qtxt = opcaoAtual.tipo === 'cama' ? `${q} cama${q > 1 ? 's' : ''}` : `${el('quantidade').value} pessoa${el('quantidade').value > 1 ? 's' : ''}`;
  el('resumo').textContent = `${opcaoAtual.nome}, ${qtxt}. De ${dataBR(el('checkin').value)} a ${dataBR(el('checkout').value)} (${opcaoAtual.noites} noite${opcaoAtual.noites > 1 ? 's' : ''}).`;
  el('total').textContent = brl(opcaoAtual.por_unidade_centavos * q);
}
el('checkin').addEventListener('change', consultar);
el('checkout').addEventListener('change', consultar);
el('quantidade').addEventListener('change', atualizarPasso3);
el('aceite').addEventListener('change', () => { el('erroForm').textContent = ''; });
el('passo3').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  el('erroForm').textContent = '';
  const nome = el('nome').value.trim();
  if (!nome.includes(' ')) return falhaForm('Informe nome e sobrenome.', 'nome');
  if (!el('email').checkValidity() || !el('email').value) return falhaForm('Informe um e-mail válido.', 'email');
  if (el('telefone').value.replace(/\D/g, '').length < 10) return falhaForm('Informe o WhatsApp com DDD.', 'telefone');
  if (!el('aceite').checked) return falhaForm('É preciso aceitar a política para continuar.', 'aceite');
  const b = el('pagar'); b.disabled = true; b.textContent = 'Abrindo o pagamento…';
  try {
    const r = await apiReservas('/api/reservas', { acomodacao: opcaoAtual.id, checkin: el('checkin').value, checkout: el('checkout').value, quantidade: Number(el('quantidade').value), nome, email: el('email').value.trim(), telefone: el('telefone').value, aceite_politica: true });
    location.href = r.pagar_url;
  } catch (e) {
    b.disabled = false; b.textContent = 'Ir para o pagamento';
    if (e.codigo === 'sem_vaga') { el('erroForm').textContent = e.message; opcaoAtual = null; await consultar(); el('passo2').scrollIntoView({ behavior: 'smooth' }); }
    else if (e.codigo === 'fora_do_ar' || e.status >= 500) erroGeral(e);
    else el('erroForm').textContent = e.message;
  }
});
function falhaForm(msg, id) { el('erroForm').textContent = msg; el(id).focus(); }
iniciar();
</script>
</main>
<footer class="max-w-3xl mx-auto px-4 pb-10 text-center text-xs text-gray-500" id="rodape">
  <a href="../politicas/" class="underline hover:text-orneon">Política de reserva, cancelamento e privacidade</a>
</footer>
</body>
</html>
